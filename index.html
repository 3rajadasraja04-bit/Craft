<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEXUS // NETRUNNER OS 2080</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ═══════════ CORE VARS ═══════════ */
:root {
  --bg-deep: #020204;
  --bg-panel: rgba(5, 8, 12, 0.65);
  --bg-panel-solid: #05080c;
  --border-dim: rgba(0, 243, 255, 0.15);
  --border-bright: rgba(0, 243, 255, 0.5);
  
  --c-cyan: #00f3ff;
  --c-magenta: #ff0055;
  --c-green: #00ff66;
  --c-amber: #ffb800;
  --c-text: #e0e6ed;
  --c-text-dim: #6b7a8f;
  
  --font-ui: 'Rajdhani', sans-serif;
  --font-code: 'Share Tech Mono', monospace;
  
  --clip-top: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
  --clip-bottom: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 0 100%);
  --clip-both: polygon(0 15px, 15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
}

/* ═══════════ RESET ═══════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-deep);
  color: var(--c-text);
  font-family: var(--font-ui);
  overflow: hidden; /* HUD style - no scrolling */
  user-select: none;
}
canvas { display: block; }

/* ═══════════ BACKGROUND & GLITCH ═══════════ */
#bg-canvas {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
}
.overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none; z-index: -1;
}
.scanlines {
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.4) 2px, rgba(0, 0, 0, 0.4) 4px);
  opacity: 0.3;
}
.vignette {
  background: radial-gradient(circle at center, transparent 40%, #000 120%);
}
.glitch-overlay {
  background: rgba(0, 243, 255, 0.03);
  animation: flicker 0.15s infinite alternate;
}
@keyframes flicker {
  0% { opacity: 0.8; } 100% { opacity: 1; }
}

/* ═══════════ HUD LAYOUT ═══════════ */
.hud-container {
  display: grid;
  grid-template-columns: 80px 1fr 380px;
  grid-template-rows: 60px 1fr 80px;
  height: 100vh;
  padding: 15px;
  gap: 15px;
}

/* ═══════════ TOP BAR ═══════════ */
.hud-top {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-dim);
  padding-bottom: 10px;
}
.sys-title {
  font-family: var(--font-code);
  font-size: 20px;
  letter-spacing: 0.4em;
  color: var(--c-cyan);
  text-shadow: 0 0 10px var(--c-cyan);
  display: flex;
  align-items: center;
  gap: 15px;
}
.sys-title::before {
  content: ''; width: 12px; height: 12px; background: var(--c-cyan);
  box-shadow: 0 0 15px var(--c-cyan); transform: rotate(45deg);
}
.top-stats {
  display: flex;
  gap: 30px;
  font-family: var(--font-code);
  font-size: 12px;
  color: var(--c-text-dim);
}
.top-stats span b { color: var(--c-text); }
.clock { color: var(--c-magenta) !important; text-shadow: 0 0 8px var(--c-magenta); }

/* ═══════════ LEFT NAV RAIL ═══════════ */
.hud-left {
  display: flex; flex-direction: column; gap: 15px;
}
.nav-btn {
  width: 70px; height: 70px;
  background: var(--bg-panel);
  border: 1px solid var(--border-dim);
  clip-path: var(--clip-both);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--c-text-dim); font-family: var(--font-code); font-size: 10px;
  cursor: pointer; transition: all 0.3s;
  position: relative;
}
.nav-btn::before {
  content: ''; position: absolute; inset: 0; background: var(--c-cyan); opacity: 0; transition: opacity 0.3s;
}
.nav-btn.active, .nav-btn:hover {
  color: var(--c-cyan); border-color: var(--c-cyan); box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.2);
}
.nav-btn svg { width: 24px; height: 24px; margin-bottom: 5px; fill: currentColor; }

/* ═══════════ CENTER STAGE ═══════════ */
.hud-center {
  position: relative;
  display: flex; flex-direction: column; gap: 15px;
}

/* Hero Panel (Radar & Core) */
.hero-panel {
  flex: 1;
  background: var(--bg-panel);
  border: 1px solid var(--border-dim);
  clip-path: var(--clip-both);
  position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.hero-panel::after {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--c-cyan), transparent);
  animation: scanline 3s linear infinite;
}
@keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }

.radar-canvas { position: absolute; inset: 0; }
.core-data {
  position: absolute; z-index: 10; text-align: center;
  font-family: var(--font-code);
}
.core-val {
  font-size: 48px; font-weight: 700; color: var(--c-cyan);
  text-shadow: 0 0 20px var(--c-cyan);
}
.core-lbl {
  font-size: 12px; letter-spacing: 0.3em; color: var(--c-text-dim);
  text-transform: uppercase;
}

/* Data Cards Row */
.data-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
.data-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-dim);
  clip-path: var(--clip-top);
  padding: 20px;
  position: relative;
}
.data-card::before {
  content: ''; position: absolute; left: 0; top: 0; width: 3px; height: 100%;
  background: var(--c-magenta);
}
.data-card.cyan::before { background: var(--c-cyan); }
.data-card.green::before { background: var(--c-green); }
.card-label { font-family: var(--font-code); font-size: 11px; color: var(--c-text-dim); letter-spacing: 0.1em; }
.card-value { font-size: 28px; font-weight: 700; margin-top: 10px; color: #fff; }
.card-value.magenta { color: var(--c-magenta); text-shadow: 0 0 10px rgba(255,0,85,0.5); }
.card-value.cyan { color: var(--c-cyan); text-shadow: 0 0 10px rgba(0,243,255,0.5); }
.card-value.green { color: var(--c-green); text-shadow: 0 0 10px rgba(0,255,102,0.5); }

/* Engine Controls */
.engine-controls {
  display: flex; gap: 15px; align-items: stretch;
}
.ctrl-input {
  flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border-dim);
  color: #fff; font-family: var(--font-code); padding: 15px;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  outline: none; transition: all 0.3s;
}
.ctrl-input:focus { border-color: var(--c-cyan); box-shadow: inset 0 0 10px rgba(0,243,255,0.1); }
.btn {
  background: rgba(0, 243, 255, 0.1); border: 1px solid var(--c-cyan);
  color: var(--c-cyan); font-family: var(--font-code); font-size: 14px;
  padding: 0 30px; cursor: pointer; letter-spacing: 0.1em;
  clip-path: var(--clip-bottom); transition: all 0.3s;
}
.btn:hover { background: var(--c-cyan); color: #000; box-shadow: 0 0 20px var(--c-cyan); }
.btn.stop { border-color: var(--c-magenta); color: var(--c-magenta); background: rgba(255,0,85,0.1); }
.btn.stop:hover { background: var(--c-magenta); color: #000; box-shadow: 0 0 20px var(--c-magenta); }

/* ═══════════ RIGHT SIDEBAR (LOGS & BOTS) ═══════════ */
.hud-right {
  display: flex; flex-direction: column; gap: 15px;
}
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border-dim);
  clip-path: var(--clip-both);
  display: flex; flex-direction: column;
}
.panel-header {
  padding: 15px 20px; border-bottom: 1px solid var(--border-dim);
  font-family: var(--font-code); font-size: 12px; letter-spacing: 0.2em;
  color: var(--c-text-dim); display: flex; justify-content: space-between;
}
.panel-header span { color: var(--c-cyan); }
.panel-body { flex: 1; overflow-y: auto; padding: 10px; }
.panel-body::-webkit-scrollbar { width: 4px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border-dim); }

/* Bot List specific */
.bot-node {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px; margin-bottom: 5px; background: rgba(255,255,255,0.02);
  border-left: 2px solid transparent; transition: all 0.2s;
}
.bot-node:hover { background: rgba(0,243,255,0.05); border-left-color: var(--c-cyan); }
.bot-id { font-family: var(--font-code); font-size: 12px; color: var(--c-cyan); width: 30px; }
.bot-uid { font-family: var(--font-code); font-size: 12px; flex: 1; color: #fff; }
.bot-status {
  font-family: var(--font-code); font-size: 10px; padding: 3px 8px;
  background: rgba(255,255,255,0.1); color: #fff;
}
.bot-status.playing { background: rgba(0, 255, 102, 0.2); color: var(--c-green); border: 1px solid var(--c-green); }
.bot-status.waiting { background: rgba(255, 184, 0, 0.2); color: var(--c-amber); border: 1px solid var(--c-amber); }
.bot-status.error { background: rgba(255, 0, 85, 0.2); color: var(--c-magenta); border: 1px solid var(--c-magenta); }

/* Log specific */
.log-line {
  font-family: var(--font-code); font-size: 11px; margin-bottom: 6px;
  color: var(--c-text-dim); animation: logIn 0.3s;
}
@keyframes logIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
.log-time { color: #444; margin-right: 10px; }
.log-line.cyan { color: var(--c-cyan); }
.log-line.green { color: var(--c-green); }
.log-line.red { color: var(--c-magenta); }
.log-line.amber { color: var(--c-amber); }

/* ═══════════ BOTTOM TERMINAL TRIGGER ═══════════ */
.hud-bottom {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border-dim); padding-top: 10px;
  font-family: var(--font-code); font-size: 12px; color: var(--c-text-dim);
}
.term-trigger {
  background: none; border: none; color: var(--c-cyan); cursor: pointer;
  font-family: var(--font-code); font-size: 12px; display: flex; align-items: center; gap: 10px;
}
.term-trigger:hover { text-shadow: 0 0 10px var(--c-cyan); }

/* ═══════════ FULLSCREEN TERMINAL OVERLAY ═══════════ */
.term-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(2, 2, 4, 0.95); backdrop-filter: blur(10px);
  z-index: 1000; display: flex; flex-direction: column;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.term-overlay.active { opacity: 1; pointer-events: all; }
.term-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 40px; border-bottom: 1px solid var(--border-bright);
  background: rgba(0, 243, 255, 0.05);
}
.term-title { font-family: var(--font-code); font-size: 18px; color: var(--c-cyan); letter-spacing: 0.2em; }
.term-close { background: none; border: none; color: var(--c-magenta); font-family: var(--font-code); cursor: pointer; font-size: 16px; }
.term-body { flex: 1; padding: 40px; overflow-y: auto; font-family: var(--font-code); font-size: 14px; line-height: 1.6; color: var(--c-text); }
.term-input-line { display: flex; gap: 15px; align-items: center; }
.term-prompt { color: var(--c-green); }
.term-input { background: none; border: none; color: #fff; font-family: var(--font-code); font-size: 14px; width: 100%; outline: none; }

/* ═══════════ RESPONSIVE (MOBILE HUD) ═══════════ */
@media (max-width: 1024px) {
  .hud-container {
    grid-template-columns: 1fr;
    grid-template-rows: 60px auto 1fr 60px;
    overflow-y: auto;
  }
  .hud-left {
    flex-direction: row; justify-content: space-between;
    order: 4; position: fixed; bottom: 0; left: 0; width: 100%;
    background: var(--bg-panel-solid); padding: 10px; border-top: 1px solid var(--border-dim); z-index: 100;
  }
  .nav-btn { width: 60px; height: 60px; }
  .hud-right { display: none; } /* Hide sidebar on mobile for space */
  .hud-center { order: 2; }
  .data-cards { grid-template-columns: 1fr 1fr; }
  .engine-controls { flex-direction: column; }
  .btn { padding: 15px; }
  .hud-bottom { display: none; }
}
</style>
</head>
<body>

<!-- BACKGROUNDS -->
<canvas id="bg-canvas"></canvas>
<div class="overlay scanlines"></div>
<div class="overlay vignette"></div>
<div class="overlay glitch-overlay"></div>

<!-- MAIN HUD -->
<div class="hud-container">
  
  <!-- TOP BAR -->
  <header class="hud-top">
    <div class="sys-title">NEXUS_OS_2080</div>
    <div class="top-stats">
      <span>UPTIME: <b id="sysUptime">00:00:00</b></span>
      <span>PING: <b id="sysPing">12ms</b></span>
      <span>SYS_TIME: <b class="clock" id="sysClock">00:00:00</b></span>
    </div>
  </header>

  <!-- LEFT NAV -->
  <nav class="hud-left">
    <button class="nav-btn active" onclick="switchView('overview')">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.5l6.5 14h-13L12 5.5z"/></svg>
      MAIN
    </button>
    <button class="nav-btn" onclick="switchView('bots')">
      <svg viewBox="0 0 24 24"><path d="M19 8h-2V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      NODES
    </button>
    <button class="nav-btn" onclick="switchView('social')">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      LINK
    </button>
  </nav>

  <!-- CENTER STAGE -->
  <main class="hud-center">
    <!-- Radar / Main View -->
    <div class="hero-panel">
      <canvas id="radar-canvas"></canvas>
      <div class="core-data">
        <div class="core-lbl">TOTAL MATCHES</div>
        <div class="core-val" id="uiMatches">0</div>
      </div>
    </div>

    <!-- Data Cards -->
    <div class="data-cards">
      <div class="data-card cyan">
        <div class="card-label">FOLLOWS ACQUIRED</div>
        <div class="card-value cyan" id="uiFollows">0</div>
      </div>
      <div class="data-card green">
        <div class="card-label">MAPS SUBSCRIBED</div>
        <div class="card-value green" id="uiSubscribes">0</div>
      </div>
      <div class="data-card">
        <div class="card-label">ACTIVE NODES</div>
        <div class="card-value magenta" id="uiActiveBots">0</div>
      </div>
    </div>

    <!-- Engine Control -->
    <div class="engine-controls">
      <input type="text" class="ctrl-input" id="uiTarget" placeholder="ENTER TARGET UID...">
      <button class="btn" id="btnStartEngine">INITIALIZE</button>
      <button class="btn stop" id="btnStopEngine">TERMINATE</button>
    </div>
  </main>

  <!-- RIGHT SIDEBAR -->
  <aside class="hud-right">
    <!-- Bots Panel -->
    <div class="panel" style="flex: 1;">
      <div class="panel-header">NODE REGISTRY <span id="uiNodeCount">0</span></div>
      <div class="panel-body" id="uiBotList">
        <div style="color: #444; font-family: var(--font-code); font-size: 12px;">NO ACTIVE NODES</div>
      </div>
    </div>
    
    <!-- Logs Panel -->
    <div class="panel" style="flex: 1;">
      <div class="panel-header">DATA STREAM <span>LIVE</span></div>
      <div class="panel-body" id="uiLogs">
        <div class="log-line cyan">[SYS] Awaiting telemetry...</div>
      </div>
    </div>
  </aside>

  <!-- BOTTOM BAR -->
  <footer class="hud-bottom">
    <div>NETRUNNER INTERFACE // v2.0.80</div>
    <button class="term-trigger" id="btnOpenTerm">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8l8 5 8-5v10zm-8-7L4 6h16l-8 5z"/></svg>
      ACCESS TERMINAL [ ` ]
    </button>
    <div>SECURE CONNECTION <b style="color:var(--c-green)">ESTABLISHED</b></div>
  </footer>
</div>

<!-- TERMINAL OVERLAY -->
<div class="term-overlay" id="termOverlay">
  <div class="term-header">
    <div class="term-title">ROOT@NEXUS:~#</div>
    <button class="term-close" id="btnCloseTerm">[ CLOSE ]</button>
  </div>
  <div class="term-body" id="termBody">
    <div class="term-input-line">
      <span class="term-prompt">root@nexus:~#</span>
      <input type="text" class="term-input" id="termInput" autocomplete="off" spellcheck="false">
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   NEXUS OS 2080 · JS ENGINE
   ═══════════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);

// State
let ws = null;
let sysState = {
  matches: 0, follows: 0, subscribes: 0, activeBots: 0,
  bots: {}, startTime: Date.now()
};

// 1. Background Particle Canvas
const bgCanvas = $('#bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let particles = [];
function initBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  particles = [];
  for(let i=0; i<100; i++) {
    particles.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5
    });
  }
}
function drawBg() {
  bgCtx.fillStyle = 'rgba(2, 2, 4, 0.5)'; // Trail effect
  bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  
  bgCtx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
  bgCtx.lineWidth = 1;
  
  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy;
    if(p.x < 0 || p.x > bgCanvas.width) p.vx *= -1;
    if(p.y < 0 || p.y > bgCanvas.height) p.vy *= -1;
    
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, 1.5, 0, Math.PI*2);
    bgCtx.fillStyle = 'rgba(0, 243, 255, 0.5)';
    bgCtx.fill();
    
    // Connect nearby particles
    for(let j=i+1; j<particles.length; j++) {
      const p2 = particles[j];
      const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
      if(dist < 100) {
        bgCtx.beginPath();
        bgCtx.moveTo(p.x, p.y);
        bgCtx.lineTo(p2.x, p2.y);
        bgCtx.stroke();
      }
    }
  });
  requestAnimationFrame(drawBg);
}
initBg();
drawBg();

// 2. Radar Canvas (Hero Panel)
const radarCanvas = $('#radar-canvas');
const radarCtx = radarCanvas.getContext('2d');
let radarAngle = 0;
function resizeRadar() {
  const panel = radarCanvas.parentElement;
  radarCanvas.width = panel.clientWidth;
  radarCanvas.height = panel.clientHeight;
}
function drawRadar() {
  const w = radarCanvas.width, h = radarCanvas.height;
  const cx = w/2, cy = h/2, r = Math.min(w, h)/2 - 20;
  
  radarCtx.clearRect(0, 0, w, h);
  
  // Rings
  radarCtx.strokeStyle = 'rgba(0, 243, 255, 0.1)';
  radarCtx.lineWidth = 1;
  for(let i=1; i<=4; i++) {
    radarCtx.beginPath();
    radarCtx.arc(cx, cy, r * (i/4), 0, Math.PI*2);
    radarCtx.stroke();
  }
  
  // Crosshairs
  radarCtx.beginPath();
  radarCtx.moveTo(cx - r, cy); radarCtx.lineTo(cx + r, cy);
  radarCtx.moveTo(cx, cy - r); radarCtx.lineTo(cx, cy + r);
  radarCtx.stroke();

  // Sweeper
  radarAngle += 0.02;
  const grad = radarCtx.createConicGradient(radarAngle, cx, cy);
  grad.addColorStop(0, 'rgba(0, 243, 255, 0.2)');
  grad.addColorStop(0.15, 'transparent');
  grad.addColorStop(1, 'transparent');
  
  radarCtx.beginPath();
  radarCtx.arc(cx, cy, r, 0, Math.PI*2);
  radarCtx.fillStyle = grad;
  radarCtx.fill();
  
  // Blips (Bots)
  const botCount = Math.min(sysState.activeBots, 8);
  for(let i=0; i<botCount; i++) {
    const a = (i * Math.PI * 2 / 8) + (radarAngle * 0.5);
    const dist = r * 0.4 + Math.sin(radarAngle * 2 + i) * r * 0.3;
    const bx = cx + Math.cos(a) * dist;
    const by = cy + Math.sin(a) * dist;
    
    radarCtx.beginPath();
    radarCtx.arc(bx, by, 3, 0, Math.PI*2);
    radarCtx.fillStyle = '#ff0055';
    radarCtx.shadowColor = '#ff0055';
    radarCtx.shadowBlur = 10;
    radarCtx.fill();
    radarCtx.shadowBlur = 0;
  }
  
  requestAnimationFrame(drawRadar);
}
window.addEventListener('resize', () => { initBg(); resizeRadar(); });
setTimeout(resizeRadar, 100);
drawRadar();

// 3. WebSocket Connection
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  
  ws.onopen = () => addLog('SYS', 'Neural link established.', 'green');
  ws.onclose = () => {
    addLog('SYS', 'Neural link severed. Reconnecting...', 'red');
    setTimeout(connectWS, 3000);
  };
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'init' || msg.type === 'status') {
        updateUI(msg.data);
      } else if (msg.type === 'log' || msg.type === 'err') {
        addLog(msg.data.icon || 'LOG', msg.data.msg, msg.data.style);
      }
    } catch(err) {}
  };
}
connectWS();

// 4. UI Update
function updateUI(data) {
  sysState.matches = data.totals.matches;
  sysState.follows = data.totals.follows;
  sysState.subscribes = data.totals.subscribes;
  sysState.activeBots = Object.keys(data.bots).length;
  
  // Hero
  animateValue('uiMatches', sysState.matches);
  $('#uiFollows').innerText = sysState.follows;
  $('#uiSubscribes').innerText = sysState.subscribes;
  $('#uiActiveBots').innerText = sysState.activeBots;
  
  // Bots List
  const list = $('#uiBotList');
  $('#uiNodeCount').innerText = sysState.activeBots;
  
  if (sysState.activeBots === 0) {
    list.innerHTML = '<div style="color: #444; font-family: var(--font-code); font-size: 12px;">NO ACTIVE NODES</div>';
  } else {
    list.innerHTML = Object.entries(data.bots).map(([id, bot]) => {
      let stClass = 'waiting';
      if(bot.status.includes('Play')) stClass = 'playing';
      if(bot.status.includes('Err')) stClass = 'error';
      
      return `
        <div class="bot-node">
          <div class="bot-id">#${id}</div>
          <div class="bot-uid">${bot.uid.substring(0,6)}..${bot.uid.substring(bot.uid.length-4)}</div>
          <div class="bot-status ${stClass}">${bot.status.substring(0,7)}</div>
        </div>
      `;
    }).join('');
  }
}

// Number animation
function animateValue(id, end) {
  const obj = document.getElementById(id);
  const start = parseInt(obj.innerText) || 0;
  if (start === end) return;
  const duration = 500;
  const startTime = performance.now();
  
  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    obj.innerText = Math.floor(progress * (end - start) + start);
    if (progress < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

// 5. Logs
function addLog(icon, msg, style) {
  const logs = $('#uiLogs');
  const now = new Date().toTimeString().slice(0,8);
  const line = document.createElement('div');
  line.className = `log-line ${style || ''}`;
  line.innerHTML = `<span class="log-time">[${now}]</span> ${msg}`;
  logs.appendChild(line);
  logs.scrollTop = logs.scrollHeight;
  if(logs.children.length > 50) logs.removeChild(logs.firstChild);
}

// 6. Clocks & Uptime
setInterval(() => {
  const now = new Date();
  $('#sysClock').innerText = now.toTimeString().slice(0,8);
  
  const uptime = Math.floor((Date.now() - sysState.startTime) / 1000);
  const h = String(Math.floor(uptime/3600)).padStart(2,'0');
  const m = String(Math.floor((uptime%3600)/60)).padStart(2,'0');
  const s = String(uptime%60).padStart(2,'0');
  $('#sysUptime').innerText = `${h}:${m}:${s}`;
}, 1000);

// 7. Controls
$('#btnStartEngine').onclick = async () => {
  const target = $('#uiTarget').value;
  const cfg = { seq_mode: true, start_map: 1, end_map: 24, hold_secs: 60, target, auto_follow: !!target };
  
  $('#btnStartEngine').innerText = 'INITIALIZING...';
  try {
    const res = await fetch('/api/start', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(cfg)
    }).then(r => r.json());
    
    if(res.ok) addLog('SYS', `Engine initialized. ${res.bots} nodes active.`, 'green');
    else addLog('SYS', `Error: ${res.error}`, 'red');
  } catch(e) { addLog('SYS', e.message, 'red'); }
  $('#btnStartEngine').innerText = 'INITIALIZE';
};

$('#btnStopEngine').onclick = async () => {
  $('#btnStopEngine').innerText = 'TERMINATING...';
  try {
    const res = await fetch('/api/stop', { method: 'POST' }).then(r => r.json());
    if(res.ok) addLog('SYS', 'Engine terminated.', 'red');
  } catch(e) { addLog('SYS', e.message, 'red'); }
  $('#btnStopEngine').innerText = 'TERMINATE';
};

// 8. Terminal Overlay Logic
const termOverlay = $('#termOverlay');
const termBody = $('#termBody');
const termInput = $('#termInput');

function toggleTerm() {
  termOverlay.classList.toggle('active');
  if(termOverlay.classList.contains('active')) setTimeout(() => termInput.focus(), 100);
}

$('#btnOpenTerm').onclick = toggleTerm;
$('#btnCloseTerm').onclick = toggleTerm;

document.addEventListener('keydown', e => {
  if(e.key === '`' || (e.ctrlKey && e.key === 'k')) { e.preventDefault(); toggleTerm(); }
  if(e.key === 'Escape') termOverlay.classList.remove('active');
});

termInput.addEventListener('keydown', e => {
  if(e.key === 'Enter') {
    const cmd = termInput.value.trim();
    if(!cmd) return;
    termInput.value = '';
    
    // Echo cmd
    const echo = document.createElement('div');
    echo.innerHTML = `<span class="term-prompt">root@nexus:~#</span> ${cmd}`;
    termBody.insertBefore(echo, termBody.lastElementChild);
    
    // Process cmd
    const out = document.createElement('div');
    out.style.marginBottom = '10px';
    out.style.color = 'var(--c-text-dim)';
    
    if(cmd === 'help') {
      out.innerHTML = `Available commands:<br>help - Show this<br>clear - Clear terminal<br>status - Engine status<br>nodes - List active bots<br>start - Start engine<br>stop - Stop engine<br>exit - Close terminal`;
    } else if(cmd === 'clear') {
      termBody.innerHTML = '';
      termBody.appendChild(termBody.lastElementChild);
      return;
    } else if(cmd === 'status') {
      out.innerHTML = `Matches: ${sysState.matches} | Follows: ${sysState.follows} | Subscribes: ${sysState.subscribes}`;
    } else if(cmd === 'start') {
      $('#btnStartEngine').click();
      out.innerHTML = `Engine initialization sequence triggered.`;
    } else if(cmd === 'stop') {
      $('#btnStopEngine').click();
      out.innerHTML = `Termination sequence triggered.`;
    } else if(cmd === 'exit') {
      toggleTerm();
      return;
    } else {
      out.innerHTML = `Command not found: ${cmd}`;
      out.style.color = 'var(--c-magenta)';
    }
    
    termBody.insertBefore(out, termBody.lastElementChild);
    termBody.scrollTop = termBody.scrollHeight;
  }
});

function switchView(v) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  addLog('SYS', `Switching module to ${v.toUpperCase()}...`, 'cyan');
}
</script>
