<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔥 ZHD Engine</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0a0a0f; color:#e5e7eb; font-family:ui-monospace,monospace }
  .neon { text-shadow:0 0 8px currentColor }
  .log-line{font-size:11px;line-height:1.5}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
</style>
</head>
<body class="p-3">
<div class="max-w-7xl mx-auto space-y-3">

  <!-- Header -->
  <div class="border border-cyan-500 rounded-xl p-3 bg-[#0f0f1a] flex flex-wrap items-center gap-3">
    <h1 class="text-xl font-bold text-orange-400 neon">🔥 ZHD ENGINE</h1>
    <span id="mode-badge" class="text-xs px-2 py-1 rounded bg-purple-900 text-purple-200">SEQ</span>
    <span class="text-xs text-cyan-300">🎯 <span id="hdr-target">—</span></span>
    <span class="text-xs" id="hdr-follow">🤖 OFF</span>
    <div class="ml-auto flex gap-2">
      <button onclick="openCfg()" class="px-3 py-1.5 bg-cyan-700 hover:bg-cyan-600 rounded text-sm">⚙️ Config</button>
      <button onclick="startAll()" id="btn-start" class="px-3 py-1.5 bg-green-700 hover:bg-green-600 rounded text-sm font-bold">▶ START</button>
      <button onclick="stopAll()"  id="btn-stop"  class="px-3 py-1.5 bg-red-700  hover:bg-red-600  rounded text-sm font-bold">⏹ STOP</button>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-3">
    <!-- Bots -->
    <div class="lg:col-span-1 border border-pink-500 rounded-xl p-3 bg-[#0f0f1a]">
      <h2 class="text-pink-400 font-bold mb-2">🤖 BOTS</h2>
      <div id="bots" class="space-y-1 text-xs"></div>
    </div>

    <!-- Logs -->
    <div class="lg:col-span-1 border border-green-500 rounded-xl p-3 bg-[#0f0f1a]">
      <h2 class="text-green-400 font-bold mb-2">📡 LOGS</h2>
      <div id="logs" class="h-64 overflow-y-auto space-y-0.5"></div>
    </div>

    <!-- Errors -->
    <div class="lg:col-span-1 border border-red-500 rounded-xl p-3 bg-[#0f0f1a]">
      <h2 class="text-red-400 font-bold mb-2">🚨 ERRORS</h2>
      <div id="errors" class="h-64 overflow-y-auto space-y-0.5"></div>
    </div>
  </div>

  <!-- Stats -->
  <div class="border border-purple-500 rounded-xl p-3 bg-[#0f0f1a]">
    <h2 class="text-purple-400 font-bold mb-2">
      📊 LIVE STATS
      <span class="text-xs text-green-400 ml-3">✅ <span id="tot-matches">0</span></span>
      <span class="text-xs text-red-400 ml-2">❌ <span id="tot-errors">0</span></span>
    </h2>
    <div class="overflow-x-auto">
      <table class="w-full text-xs">
        <thead class="text-purple-300 border-b border-purple-800">
          <tr><th>#</th><th>UID</th><th>Status</th><th>Map</th><th>EID</th><th>Time</th><th>Maps</th><th>Follow</th></tr>
        </thead>
        <tbody id="stats-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Social -->
  <div class="border border-cyan-500 rounded-xl p-3 bg-[#0f0f1a]">
    <h2 class="text-cyan-400 font-bold mb-2">🌐 SOCIAL ACTIONS</h2>
    <div class="flex flex-wrap gap-2 mb-2">
      <input id="soc-target" placeholder="Target UID / Map Code" class="flex-1 min-w-[200px] bg-black border border-cyan-800 rounded px-2 py-1 text-xs">
      <button onclick="doSocial('Follow')"    class="px-3 py-1 bg-blue-700 hover:bg-blue-600 rounded text-xs">Follow</button>
      <button onclick="doSocial('Subscribe')" class="px-3 py-1 bg-yellow-700 hover:bg-yellow-600 rounded text-xs">Subscribe</button>
    </div>
    <div id="social" class="text-xs space-y-0.5 max-h-32 overflow-y-auto"></div>
    <div class="mt-2 text-xs text-cyan-300">
      🎯 Follows: <span id="tot-follows" class="text-green-400">0</span> |
      ⭐ Subscribes: <span id="tot-subs" class="text-yellow-400">0</span>
    </div>
  </div>

</div>

<!-- Config Modal -->
<div id="cfg-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
  <div class="bg-[#0f0f1a] border border-cyan-500 rounded-xl p-4 w-full max-w-md space-y-2 text-xs">
    <h2 class="text-cyan-400 font-bold">⚙️ CONFIG</h2>
    <label class="block">Target UID <input id="c-target" class="w-full bg-black border border-cyan-800 rounded px-2 py-1"></label>
    <label class="flex items-center gap-2"><input id="c-autofollow" type="checkbox"> Auto-Follow</label>
    <label class="flex items-center gap-2"><input id="c-seq" type="checkbox" checked> Sequential Mode</label>
    <div class="grid grid-cols-2 gap-2">
      <label>Start map <input id="c-start" type="number" value="1" min="1" max="24" class="w-full bg-black border border-cyan-800 rounded px-2 py-1"></label>
      <label>End map <input id="c-end" type="number" value="24" min="1" max="24" class="w-full bg-black border border-cyan-800 rounded px-2 py-1"></label>
      <label>Hold (s) <input id="c-hold" type="number" value="60" class="w-full bg-black border border-cyan-800 rounded px-2 py-1"></label>
      <label>Sync (s) <input id="c-sync" type="number" value="10" class="w-full bg-black border border-cyan-800 rounded px-2 py-1"></label>
    </div>
    <div class="flex justify-end gap-2 pt-2">
      <button onclick="closeCfg()" class="px-3 py-1 bg-gray-700 rounded">Cancel</button>
      <button onclick="saveCfg()" class="px-3 py-1 bg-cyan-700 rounded font-bold">Save & Close</button>
    </div>
  </div>
</div>

<script>
const state = { bots:{}, logs:[], errors:[], social:{}, cfg:{} };
let ws;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "status") { state.bots = m.data.bots; state.social = m.data.social;
      document.getElementById("tot-matches").textContent = m.data.total_matches;
      document.getElementById("tot-errors").textContent  = m.data.total_errors;
      document.getElementById("tot-follows").textContent = m.data.total_follows;
      document.getElementById("tot-subs").textContent    = m.data.total_subscribes;
      document.getElementById("mode-badge").textContent  = m.data.seq_mode ? "SEQ" : "TIMER";
      document.getElementById("hdr-target").textContent  = m.data.target_uid || "—";
      document.getElementById("hdr-follow").textContent  = m.data.auto_follow ? "🤖 ON" : "🤖 OFF";
      document.getElementById("hdr-follow").className    = "text-xs " + (m.data.auto_follow ? "text-purple-400" : "text-gray-500");
      document.getElementById("btn-start").disabled = m.data.running;
      document.getElementById("btn-stop").disabled  = !m.data.running;
      renderBots(); renderStats(); renderSocial();
    } else if (m.type === "log" || m.type === "error") {
      const bucket = m.type === "log" ? state.logs : state.errors;
      bucket.push(m.data); if (bucket.length > 200) bucket.shift();
      renderLogs();
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

function colorFor(style){
  return {cyan:"text-cyan-400",green:"text-green-400",yellow:"text-yellow-400",
          red:"text-red-400",purple:"text-purple-400",orange:"text-orange-400"}[style] || "text-gray-300";
}

function renderBots(){
  const el = document.getElementById("bots");
  const entries = Object.entries(state.bots);
  if (!entries.length) { el.innerHTML = '<div class="text-gray-500">No bots</div>'; return; }
  el.innerHTML = entries.map(([i,b]) => {
    const s = b.status || "-";
    const c = s.includes("Playing") ? "text-green-400" :
              s.includes("Error") || s.includes("Fail") ? "text-red-400" :
              s.includes("Wait") || s.includes("Cool") ? "text-yellow-400" : "text-cyan-400";
    return `<div class="flex justify-between border-b border-gray-800 py-1">
      <span class="text-purple-400">#${i}</span>
      <span class="text-cyan-300">${b.uid.slice(0,6)}..${b.uid.slice(-2)}</span>
      <span class="${c}">${s}</span></div>`;
  }).join("");
}

function renderStats(){
  const body = document.getElementById("stats-body");
  const entries = Object.entries(state.bots);
  if (!entries.length) { body.innerHTML = '<tr><td colspan="8" class="text-gray-500 text-center py-2">No bots</td></tr>'; return; }
  body.innerHTML = entries.map(([i,b]) => {
    const lock = b.follow_done ? '<span class="text-green-400">✅ SUCCESS</span>'
      : `<span class="${(b.matches_played||0)>=20?'text-yellow-400':'text-red-400'}">${Math.min(b.matches_played||0,20)}/20</span>`;
    const map = (b.map||"-");
    const mapShort = map.length > 12 ? map.slice(8,12)+"…" : map;
    return `<tr class="border-b border-gray-800">
      <td class="text-purple-400">${i}</td>
      <td class="text-cyan-300">${b.aid || b.uid}</td>
      <td>${b.status||"-"}</td>
      <td class="text-pink-400">${mapShort}</td>
      <td class="text-green-400">${b.entity ?? "-"}</td>
      <td class="text-orange-400">${(b.time_in_match||0).toFixed(0)}s</td>
      <td>${b.matches_played||0}</td>
      <td>${lock}</td></tr>`;
  }).join("");
}

function renderLogs(){
  ["logs","errors"].forEach(k => {
    const el = document.getElementById(k);
    el.innerHTML = state[k].slice(-100).map(l =>
      `<div class="log-line ${colorFor(l.style)}">[${l.ts}] ${l.icon} ${l.msg}</div>`).join("");
    el.scrollTop = el.scrollHeight;
  });
}

function renderSocial(){
  const el = document.getElementById("social");
  const entries = Object.entries(state.social || {});
  if (!entries.length) { el.innerHTML = '<div class="text-gray-500">No social actions yet</div>'; return; }
  el.innerHTML = entries.slice(-8).map(([i,s]) => {
    const c = s.status === "Success" ? "text-green-400" :
              s.status?.includes("Lock") || s.status?.includes("Wait") ? "text-yellow-400" :
              s.status?.includes("Fail") || s.status?.includes("Err") ? "text-red-400" : "text-cyan-400";
    return `<div class="flex justify-between border-b border-gray-800 py-0.5">
      <span class="text-purple-400">#${i}</span>
      <span class="text-pink-400">${s.action}</span>
      <span class="text-gray-400 truncate max-w-[140px]">${s.map || s.target}</span>
      <span class="${c}">${s.status}</span></div>`;
  }).join("");
}

// ─── Config modal ────────────────────────────────────────────────────────
function openCfg(){
  fetch("/api/config").then(r=>r.json()).then(c => {
    document.getElementById("c-target").value     = c.target_uid || "";
    document.getElementById("c-autofollow").checked = !!c.auto_follow;
    document.getElementById("cfg-modal").classList.replace("hidden","flex");
  });
}
function closeCfg(){ document.getElementById("cfg-modal").classList.replace("flex","hidden"); }
function saveCfg(){
  const cfg = {
    target_uid: document.getElementById("c-target").value.trim(),
    auto_follow: document.getElementById("c-autofollow").checked,
  };
  fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cfg)})
    .then(()=>closeCfg());
}

// ─── Actions ─────────────────────────────────────────────────────────────
async function startAll(){
  const cfg = {
    target_uid: document.getElementById("c-target").value.trim(),
    auto_follow: document.getElementById("c-autofollow").checked,
    seq_mode: document.getElementById("c-seq").checked,
    start_map: +document.getElementById("c-start").value,
    end_map:   +document.getElementById("c-end").value,
    hold_secs: +document.getElementById("c-hold").value,
    sync_secs: +document.getElementById("c-sync").value,
  };
  const r = await fetch("/api/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cfg)});
  const j = await r.json();
  if (!r.ok) alert("Start failed: " + (j.detail || "unknown"));
}
async function stopAll(){ await fetch("/api/stop",{method:"POST"}); }
async function doSocial(action){
  const t = document.getElementById("soc-target").value.trim();
  if (!t) return alert("Target required");
  const url = action === "Follow" ? "/api/social/follow" : "/api/social/subscribe";
  const r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target:t})});
  const j = await r.json();
  if (!r.ok) alert(j.detail || "failed");
}

connect();
</script>
</body>
</html>
